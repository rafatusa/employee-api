version: 1
name: employee-api
vcs: github
stages:
  - id: test
    kind: test
    timeout_minutes: 20
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Run unit, integration and API tests
        run: mvn -B verify -Ptest-report
      - name: Upload Surefire HTML report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: target/site/surefire-report.html

  - id: build
    kind: build
    needs:
      - test
    timeout_minutes: 15
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Build JAR (skip tests — already ran)
        run: mvn -B package -DskipTests
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  - id: provision
    kind: provision
    needs:
      - build
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-2
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: 'false'
      - name: Terraform init
        run: |
          cd infra
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
      - name: Terraform apply
        run: |
          cd infra
          terraform apply -auto-approve -input=false

  - id: configure
    kind: configure
    needs:
      - provision
    timeout_minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-2
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: 'false'
      - name: Read instance IP
        id: infra
        run: |
          cd infra
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          echo "ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/
      - name: Install Ansible
        run: pipx install ansible-core
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ steps.infra.outputs.ip }}" >> ~/.ssh/known_hosts
      - name: Configure server
        run: |
          ansible-playbook \
            -i "${{ steps.infra.outputs.ip }}," \
            -u "$SSH_USER" \
            --private-key ~/.ssh/deploy_key \
            ansible/playbook.yml

  - id: verify
    kind: verify
    needs:
      - configure
    timeout_minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-2
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: 'false'
      - name: Health check
        run: |
          cd infra
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          IP=$(terraform output -raw public_ip)
          curl --fail --retry 12 --retry-delay 15 --retry-all-errors "http://$IP/health"
          echo "Deploy verified — Employee API live at http://$IP"

rollback:
  strategy: rerun

pipelines:
  - id: post-deploy-report
    stages:
      - id: fetch-report
        kind: custom
        timeout_minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-2
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_wrapper: 'false'
          - name: Get instance IP
            id: infra
            run: |
              cd infra
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
                -backend-config="region=$AWS_REGION"
              echo "ip=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
          - name: Write SSH key
            run: |
              mkdir -p ~/.ssh
              printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
              chmod 600 ~/.ssh/deploy_key
              ssh-keyscan -H "${{ steps.infra.outputs.ip }}" >> ~/.ssh/known_hosts
          - name: Download Surefire report from server
            run: |
              scp -i ~/.ssh/deploy_key \
                "$SSH_USER@${{ steps.infra.outputs.ip }}:/opt/employee-api/test-report/surefire-report.html" \
                ./surefire-report.html
          - name: Upload HTML test report artifact
            uses: actions/upload-artifact@v4
            with:
              name: post-deploy-test-report
              path: surefire-report.html
