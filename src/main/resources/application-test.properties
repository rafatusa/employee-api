# Test profile — used by all @SpringBootTest tests
# Fixed JWT secret (>=32 chars, alphanumeric only) for deterministic token signing in tests
app.jwt.secret=testSecretKeyForJwtSigningMinimum32Chars
app.jwt.expiration-ms=3600000

# Keep H2 in-memory for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Exclude WebTestClientAutoConfiguration — it is hardcoded into the @WebMvcTest
# ImportsContextCustomizer but this exclusion applies when loaded via
# @SpringBootTest + @EnableAutoConfiguration (the full-context path).
spring.autoconfigure.exclude=\
  org.springframework.boot.test.autoconfigure.web.reactive.WebTestClientAutoConfiguration
