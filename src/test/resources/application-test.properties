# Test profile — H2 in-memory, fixed JWT secret for deterministic tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Fixed secret ensures JwtUtil tests are deterministic
app.jwt.secret=test-secret-key-that-is-long-enough-for-hmac-in-tests-ok
app.jwt.expiration-ms=3600000

# Suppress SQL noise in test output
spring.jpa.show-sql=false
logging.level.org.springframework.security=WARN
