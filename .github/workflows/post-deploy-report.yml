name: post-deploy-report
'on':
  workflow_dispatch: {}
jobs:
  fetch-report:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-2
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: 'false'
    - id: infra
      name: Get instance IP
      run: "cd infra\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=$AWS_REGION\"\necho\
        \ \"ip=$(terraform output -raw public_ip)\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Write SSH key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        ssh-keyscan -H "${{ steps.infra.outputs.ip }}" >> ~/.ssh/known_hosts

        '
    - name: Download Surefire report from server
      run: "scp -i ~/.ssh/deploy_key \\\n  \"$SSH_USER@${{ steps.infra.outputs.ip\
        \ }}:/opt/employee-api/test-report/surefire-report.html\" \\\n  ./surefire-report.html\n"
    - name: Upload HTML test report artifact
      uses: actions/upload-artifact@v4
      with:
        name: post-deploy-test-report
        path: surefire-report.html
