name: deploy
'on':
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: maven
    - name: Run unit, integration and API tests
      run: mvn -B verify -Ptest-report
    - name: Upload Surefire HTML report
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: target/site/surefire-report.html
  build:
    runs-on: ubuntu-latest
    needs:
    - test
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
        cache: maven
    - name: "Build JAR (skip tests \u2014 already ran)"
      run: mvn -B package -DskipTests
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: target/*.jar
  provision:
    runs-on: ubuntu-latest
    needs:
    - build
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-2
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: 'false'
    - name: Terraform init
      run: "cd infra\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=$AWS_REGION\"\n"
    - name: Terraform apply
      run: 'cd infra

        terraform apply -auto-approve -input=false

        '
  configure:
    runs-on: ubuntu-latest
    needs:
    - provision
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-2
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: 'false'
    - id: infra
      name: Read instance IP
      run: "cd infra\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=$AWS_REGION\"\necho\
        \ \"ip=$(terraform output -raw public_ip)\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: app-jar
        path: target/
    - name: Install Ansible
      run: pipx install ansible-core
    - name: Write SSH key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        ssh-keyscan -H "${{ steps.infra.outputs.ip }}" >> ~/.ssh/known_hosts

        '
    - name: Configure server
      run: "ansible-playbook \\\n  -i \"${{ steps.infra.outputs.ip }},\" \\\n  -u\
        \ \"$SSH_USER\" \\\n  --private-key ~/.ssh/deploy_key \\\n  ansible/playbook.yml\n"
  verify:
    runs-on: ubuntu-latest
    needs:
    - configure
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-2
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: 'false'
    - name: Health check
      run: "cd infra\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=$AWS_REGION\"\nIP=$(terraform\
        \ output -raw public_ip)\ncurl --fail --retry 12 --retry-delay 15 --retry-all-errors\
        \ \"http://$IP/health\"\necho \"Deploy verified \u2014 Employee API live at\
        \ http://$IP\"\n"
